        }
      }

      /**
       * Render one memory list or an empty-state message.
       *
       * @param {HTMLElement} element
       * @param {string[]} memoryTexts
       * @returns {void}
       */
      function renderMemoryList(element, memoryTexts) {
        element.innerHTML = "";
        if (memoryTexts.length === 0) {
          setEmptyState(element, "No memories captured at this tier.");
          return;
        }
        for (const memoryText of memoryTexts) {
          const item = document.createElement("li");
          item.className = "memory-item";
          item.innerHTML = `
            <p class="memory-heading">Memory</p>
            <p class="memory-text">${memoryText}</p>
          `;
          element.appendChild(item);
        }
      }

      /**
       * Render memory and relationship panels for the selected villager.
       *
       * @param {Record<string, unknown>} session
       * @returns {void}
       */
      function renderMemoryAndRelationshipPanels(session) {
        const dom = APP_STATE.dom;
        if (dom === null) {
          return;
        }
        const view = getSelectedVillagerView(session);
        if (view.villagerState === null) {
          setEmptyState(dom.shortTermMemoryList, "No memory data is available.");
          setEmptyState(dom.mediumTermMemoryList, "No memory data is available.");
          setEmptyState(dom.longTermMemoryList, "No memory data is available.");
          setEmptyState(dom.relationshipList, "No relationship data is available.");
          return;
        }
        renderMemoryList(
          dom.shortTermMemoryList,
          /** @type {string[]} */ (view.villagerState.short_term_memory_texts || []),
        );
        renderMemoryList(
          dom.mediumTermMemoryList,
          /** @type {string[]} */ (view.villagerState.medium_term_memory_texts || []),
        );
        renderMemoryList(
          dom.longTermMemoryList,
          /** @type {string[]} */ (view.villagerState.long_term_memory_texts || []),
        );

        const relationshipDescriptions = /** @type {Record<string, string>} */ (
          view.villagerState.relationship_descriptions || {}
        );
        const recentImpressions = /** @type {Record<string, string[]>} */ (
          view.villagerState.recent_impressions || {}
        );
        dom.relationshipList.innerHTML = "";
        const villagerIds = /** @type {string[]} */ (session._all_villager_ids || []);
        const otherVillagers = villagerIds.filter(
          (villagerId) => villagerId !== session.selected_villager_id,
        );
        if (otherVillagers.length === 0) {
          setEmptyState(dom.relationshipList, "No other villagers are present.");
          return;
        }
        for (const otherVillagerId of otherVillagers) {
          const relationshipCard = document.createElement("li");
          relationshipCard.className = "relationship-card";
          relationshipCard.id = `relationship-${otherVillagerId}`;
          relationshipCard.innerHTML = `
            <p class="relationship-name">${formatLabel(otherVillagerId)}</p>
            <p class="relationship-text">${
              relationshipDescriptions[otherVillagerId] || "No relationship description recorded."
            }</p>
          `;
          const impressionList = document.createElement("ul");
          impressionList.className = "impression-list";
          const impressions = recentImpressions[otherVillagerId] || [];
          if (impressions.length === 0) {
            const emptyItem = document.createElement("li");
            emptyItem.className = "impression-item";
            emptyItem.textContent = "No recent impressions recorded.";
            impressionList.appendChild(emptyItem);
          } else {
            for (const impressionText of impressions) {
              const impressionItem = document.createElement("li");
              impressionItem.className = "impression-item";
              impressionItem.textContent = impressionText;
              impressionList.appendChild(impressionItem);
            }
          }
          relationshipCard.appendChild(impressionList);
          dom.relationshipList.appendChild(relationshipCard);
        }
      }

      /**
       * Render the currently selected event log.
       *
       * @param {Record<string, unknown>} session
       * @param {boolean} syncScroll
       * @returns {void}
       */
      function renderEventLog(session, syncScroll) {
        const dom = APP_STATE.dom;
        if (dom === null) {
          return;
        }
        const visibleEvents = /** @type {Record<string, unknown>[]} */ (session.visible_events);
        dom.eventLog.innerHTML = "";
        visibleEvents.forEach((eventEntry, index) => {
          const entry = document.createElement("article");
          entry.className = "event-entry";
          entry.dataset.eventIndex = String(index);
          entry.dataset.gameTime = String(eventEntry.game_time);
          entry.id = `event-entry-${index}`;
          entry.innerHTML = `
            <span class="event-timestamp">${formatGameTime(Number(eventEntry.game_time))}</span>
            <p class="event-text">${String(eventEntry.text)}</p>
          `;
          entry.addEventListener("click", () => {
            const currentSession = APP_STATE.session;
            if (currentSession === null) {
              return;
            }
            scrollToEvent(currentSession, index);
            renderSession(currentSession, { rerenderLog: false, syncScroll: true });
          });
          dom.eventLog.appendChild(entry);
        });
        dom.eventLogSummary.textContent = `${visibleEvents.length} visible events for ${formatLabel(String(session.selected_villager_id))}.`;
        APP_STATE.lastRenderedLogVillagerId = String(session.selected_villager_id);
        updateActiveEvent(session);
        if (syncScroll) {
          syncEventScrollPosition(session);
        }
      }

      /**
       * Update the active event class without rebuilding the log.
       *
       * @param {Record<string, unknown>} session
       * @returns {void}
       */
      function updateActiveEvent(session) {
        const dom = APP_STATE.dom;
        if (dom === null) {
          return;
        }
        const activeIndex = Number(session._current_event_index);
        for (const node of dom.eventLog.querySelectorAll(".event-entry")) {
          if (!(node instanceof HTMLElement)) {
            continue;
          }
          node.classList.toggle("is-active", Number(node.dataset.eventIndex) === activeIndex);
        }
      }

      /**
       * Sync the event-log scroll position to the current active entry.
       *
       * @param {Record<string, unknown>} session
       * @returns {void}
       */
      function syncEventScrollPosition(session) {
        const dom = APP_STATE.dom;
        if (dom === null) {
          return;
        }
        const activeEntry = dom.eventLog.querySelector(
          `[data-event-index="${String(session._current_event_index)}"]`,
        );
        if (!(activeEntry instanceof HTMLElement)) {
          return;
        }
        APP_STATE.suppressScrollSync = true;
        activeEntry.scrollIntoView({ block: "center" });
        globalScope.setTimeout(() => {
          APP_STATE.suppressScrollSync = false;
        }, 0);
      }

      /**
       * Apply visible field-change highlights for the current session state.
       *
       * @param {Record<string, unknown>} session
       * @returns {void}
       */
      function updateHighlights(session) {
        const dom = APP_STATE.dom;
        if (dom === null) {
          return;
        }
        for (const node of document.querySelectorAll("[data-field-path]")) {
          if (node instanceof HTMLElement) {
            node.classList.remove("field-highlight");
          }
        }
        const view = getSelectedVillagerView(session);
        const villagerChangedFields =
          view.deceased || view.villagerState === null
            ? new Set()
            : /** @type {Set<string>} */ (view.villagerState.changed_fields || new Set());
        const worldChangedFields = /** @type {Set<string>} */ (
          session.world_state.changed_fields || new Set()
        );
        for (const fieldPath of villagerChangedFields) {
          for (const node of document.querySelectorAll(`[data-field-path="${CSS.escape(fieldPath)}"]`)) {
            if (node instanceof HTMLElement) {
              node.classList.add("field-highlight");
            }
          }
        }
        for (const fieldPath of worldChangedFields) {
          for (const node of document.querySelectorAll(`[data-field-path="${CSS.escape(fieldPath)}"]`)) {
            if (node instanceof HTMLElement) {
              node.classList.add("field-highlight");
            }
          }
        }
      }

      /**
       * Re-render session-backed panels.
       *
       * @param {Record<string, unknown>} session
       * @param {{rerenderLog?: boolean, syncScroll?: boolean}} [options]
       * @returns {Record<string, unknown>}
       */
      function renderSession(session, options) {
        const nextOptions = options || {};
        renderVillagerSelector(session);
        renderVillagerPanel(session);
        renderWorldPanel(session);
        renderMemoryAndRelationshipPanels(session);
        if (
          nextOptions.rerenderLog
          || APP_STATE.lastRenderedLogVillagerId !== String(session.selected_villager_id)
        ) {
          renderEventLog(session, Boolean(nextOptions.syncScroll));
        } else {
          updateActiveEvent(session);
          if (nextOptions.syncScroll) {
            syncEventScrollPosition(session);
          }
        }
        updateHighlights(session);
        return session;
      }

      /**
       * Return the event index nearest the top of the visible log viewport.
       *
       * @param {HTMLElement} eventLog
       * @returns {number}
       */
      function getClosestVisibleEventIndex(eventLog) {
        const entries = [...eventLog.querySelectorAll(".event-entry")].filter(
          (node) => node instanceof HTMLElement,
        );
        if (entries.length === 0) {
          return -1;
        }
        const containerRect = eventLog.getBoundingClientRect();
        let bestIndex = -1;
        let bestDistance = Number.POSITIVE_INFINITY;
        for (const entry of entries) {
          const rect = entry.getBoundingClientRect();
          const distance = Math.abs(rect.top - containerRect.top - 12);
          if (distance < bestDistance) {
            bestDistance = distance;
            bestIndex = Number(entry.dataset.eventIndex);
          }
        }
        return bestIndex;
      }

      /**
       * Attach DOM event listeners after the app shell is created.
       *
       * @returns {void}
       */
      function attachDomEvents() {
        const dom = APP_STATE.dom;
        if (dom === null) {
          return;
        }
        dom.eventLog.addEventListener("scroll", () => {
          if (APP_STATE.suppressScrollSync) {
            return;
          }
          const session = APP_STATE.session;
          if (session === null) {
            return;
          }
          const eventIndex = getClosestVisibleEventIndex(dom.eventLog);
          if (eventIndex < 0 || eventIndex === Number(session._current_event_index)) {
            return;
          }
          scrollToEvent(session, eventIndex);
          renderSession(session, { rerenderLog: false, syncScroll: false });
        });
      }

      /**
       * Boot the standalone UI into the DOM.
       *
       * @param {string} dataDir
       * @returns {Promise<Record<string, unknown>>}
       */
      async function mountViewer(dataDir) {
        APP_STATE.dom = createAppShell();
        attachDomEvents();
        const session = await initSession(dataDir);
        APP_STATE.session = session;
        renderSession(session, { rerenderLog: true, syncScroll: true });
        return session;
      }

      /**
       * Render one loading error into the DOM.
       *
       * @param {unknown} error
       * @returns {void}
       */
      function renderError(error) {
        if (!canUseDom()) {
          return;
        }
        const root = document.getElementById("viewer-root");
        if (!(root instanceof HTMLElement)) {
          return;
        }
        root.innerHTML = `<div class="error">${String(error instanceof Error ? error.message : error)}</div>`;
      }

      /**
       * Boot the viewer automatically from the current URL if configured.
       *
       * @returns {Promise<Record<string, unknown> | null>}
       */
      async function autoMountFromLocation() {
        if (!canUseDom() || typeof globalScope.location === "undefined") {
          return null;
        }
        const params = new URLSearchParams(globalScope.location.search);
        const dataDir = params.get("dataDir") || params.get("data_dir");
        if (dataDir === null || dataDir === "") {
          return null;
        }
        return mountViewer(dataDir);
      }

      globalScope.villmageObservability = {
        initSession,
        loadAllCheckpoints,
        loadDeltaIndex,
        reconstructStateAt,
        scrollToEvent,
        selectVillager,
        renderSession,
        mountViewer,
        formatGameTime,
      };

      globalScope.villmageObservabilityReady = autoMountFromLocation().catch((error) => {
        renderError(error);
        throw error;
      });
    })(globalThis);
  </script>
</body>
</html>
